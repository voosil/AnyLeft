name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag and manifest versions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const tauriConfig = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const cargoToml = readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoToml.match(
            /\[package\][\s\S]*?\nversion\s*=\s*"([^"]+)"/,
          )?.[1];
          const versions = {
            "package.json": packageJson.version,
            "src-tauri/tauri.conf.json": tauriConfig.version,
            "src-tauri/Cargo.toml": cargoVersion,
          };
          const expectedTag = `v${packageJson.version}`;
          const actualTag = process.env.GITHUB_REF_NAME;

          for (const [file, version] of Object.entries(versions)) {
            if (version !== packageJson.version) {
              throw new Error(`${file} has version ${version}; expected ${packageJson.version}`);
            }
          }
          if (actualTag !== expectedTag) {
            throw new Error(`tag ${actualTag} does not match application version ${expectedTag}`);
          }

          console.log(`Release versions match ${actualTag}`);
          NODE

  build:
    name: Build ${{ matrix.name }}
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            signingIdentity: "-"
          - name: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            signingIdentity: "-"
          - name: Windows (x64)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            signingIdentity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test installer selection
        run: pnpm test:install

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signingIdentity }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AnyLeft ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your platform from the assets below.

            请从下方 Assets 下载对应平台的安装包。
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"
          args: --target ${{ matrix.target }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
